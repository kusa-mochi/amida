<svg width="101" height="51" xmlns="http://www.w3.org/2000/svg">
    <style type="text/css"><![CDATA[
        /* default: light mode */
        svg { color: #000000; }
        /* changeable elements use currentColor so they follow light/dark */
        g.theme-changeable { fill: transparent; stroke: currentColor; stroke-width: 1; }
        /* fixed elements keep their green color */
        g.theme-fixed { fill: transparent; stroke: #169632; stroke-width: 5; }
        /* prefer dark mode when supported */
        @media (prefers-color-scheme: dark) {
            svg { color: #ffffff; }
        }
    ]]></style>
    
    <g class="theme-changeable">
        <path d="M 50 0 L 50 51" />
    </g>
    <g class="theme-fixed">
        <path d="M 101 25 L 50 25 50 51" />
    </g>
</svg>
